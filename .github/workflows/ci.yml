name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # Tauri links against the system webview; only Linux needs it installed.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            file

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # --- frontend ---
      - name: Type-check
        run: npx tsc --noEmit

      - name: Frontend tests
        run: npm test

      - name: Production bundle
        run: npm run build

      # --- backend ---
      # herdr is not installed on the runners. The schema tests read a
      # committed snapshot of `herdr --default-config`, and the drift check
      # that compares it against a live binary skips itself when herdr is
      # absent. Everything else -- config path resolution per platform, CRLF
      # handling, minimal-diff writes -- runs everywhere.
      - name: Rust format
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust lint
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # Single-threaded: one test sets HERDR_CONFIG_PATH process-wide.
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test -- --test-threads=1
