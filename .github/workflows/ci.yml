name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Named images rather than -latest, which GitHub moves to a new OS
        # release on its own schedule. Dependabot does not bump these.
        os: [ubuntu-24.04, macos-26, windows-2025]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Slint's winit backend links against X11/xkb and an OpenGL loader for
      # the femtovg renderer. macOS and Windows need nothing extra.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev \
            libfontconfig-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libgl1-mesa-dev \
            build-essential

      # The version comes from rust-toolchain.toml, so CI, the release build
      # and anyone building with rustup use the same compiler.
      - name: Install the pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install
          rustup --version
          rustc --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      # herdr is not installed on the runners. The schema tests read a
      # committed snapshot of `herdr --default-config`, and the drift check
      # that compares it against a live binary skips itself when herdr is
      # absent. Everything else -- config path resolution per platform, CRLF
      # handling, minimal-diff writes, key syntax -- runs everywhere.
      #
      # Single-threaded: one test sets HERDR_CONFIG_PATH process-wide.
      - name: Tests
        run: cargo test --locked -- --test-threads=1
