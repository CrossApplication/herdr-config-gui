name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      # Slint's winit backend links against X11/xkb and an OpenGL loader for
      # the femtovg renderer. macOS and Windows need nothing extra.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev \
            libfontconfig-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libgl1-mesa-dev \
            build-essential

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      # herdr is not installed on the runners. The schema tests read a
      # committed snapshot of `herdr --default-config`, and the drift check
      # that compares it against a live binary skips itself when herdr is
      # absent. Everything else -- config path resolution per platform, CRLF
      # handling, minimal-diff writes, key syntax -- runs everywhere.
      #
      # Single-threaded: one test sets HERDR_CONFIG_PATH process-wide.
      - name: Tests
        run: cargo test -- --test-threads=1
