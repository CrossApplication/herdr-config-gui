name: Release

# A tag builds the installers, records where each one came from, and
# attaches them to a draft release for a person to publish. Running it by
# hand does everything except the release, so the bundles and their
# attestations can be checked without cutting a version.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    name: bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # macOS is deliberately absent: an unnotarised .app would teach people
    # to switch Gatekeeper off. See .claude/skills/release-signing.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            formats: deb appimage
          # No cargo-bundle on Windows. Its msi writer uses the file name as an
          # MSI identifier, which cannot hold the hyphen in herdr-config-gui.exe,
          # and its exe bundler refuses a binary with no resource section. The
          # binary needs no DLLs beside the system's, so the exe cargo builds is
          # a complete distribution on its own.
          - os: windows-2025
            formats: ""
    permissions:
      contents: read
      id-token: write      # the Sigstore certificate behind the attestation
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Refuse a tag that disagrees with Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag is $GITHUB_REF_NAME but Cargo.toml says $version"
            exit 1
          fi

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev \
            libfontconfig-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libgl1-mesa-dev \
            build-essential

      # The version comes from rust-toolchain.toml, so CI, the release build
      # and anyone building with rustup use the same compiler.
      - name: Install the pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install
          rustup --version
          rustc --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-bundle
        if: matrix.formats != ''
        run: cargo install cargo-bundle --version 0.12.0 --locked

      # Every platform builds here with --locked, so a Cargo.lock that has
      # drifted from Cargo.toml fails the release instead of being rewritten.
      # cargo-bundle has no --locked of its own; its build reuses this output.
      - name: Build
        run: cargo build --release --locked

      - name: Bundle
        if: matrix.formats != ''
        run: |
          for format in ${{ matrix.formats }}; do
            cargo bundle --release --format "$format"
          done

      - name: Collect the installers
        run: |
          mkdir -p dist
          # Only the platforms that ran cargo-bundle have this directory.
          if [ -d target/release/bundle ]; then
            find target/release/bundle -type f \
              \( -name '*.deb' -o -name '*.AppImage' \) \
              -exec cp {} dist/ \;
          fi
          # Give the bare exe the version and architecture the Linux packages
          # already carry in their names.
          if [ -f target/release/herdr-config-gui.exe ]; then
            version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
            cp target/release/herdr-config-gui.exe \
              "dist/herdr-config-gui_${version}_x86_64.exe"
          fi
          ls -l dist
          test -n "$(ls dist)"

      # Signs a statement that these exact bytes came from this commit and
      # this workflow. Anyone can check it with `gh attestation verify`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      # A draft, so nothing is public until someone has looked at it.
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --draft
