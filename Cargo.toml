[package]
name = "herdr-config-gui"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"  # what slint 1.18 requires
license = "BSD-3-Clause"
publish = false

# `cargo bundle` reads this. Tauri used to produce the .app; the identifier and
# the product name are kept as they were so an existing install is replaced
# rather than doubled.
[package.metadata.bundle]
name = "herdr Config"
identifier = "dev.herdr.config-gui"
icon = [
    "icons/32x32.png",
    "icons/128x128.png",
    "icons/128x128@2x.png",
    "icons/icon.icns",
    # The .msi bundler takes only an .ico and leaves the icon blank otherwise.
    "icons/icon.ico",
]
short_description = "A form for herdr's config.toml"

[dependencies]
# Slint under the royalty-free licence; the About dialog carries the
# attribution that licence asks for.
# `unstable-winit-030` exposes the raw winit events, which carry the physical
# key and the unswapped modifiers Slint itself discards. Key recording needs
# both: see src/physical.rs.
slint = { version = "1.18", features = ["unstable-winit-030"] }
serde = { version = "1", features = ["derive"] }
toml_edit = "0.22"
regex = "1"

[build-dependencies]
slint-build = "1.18"
