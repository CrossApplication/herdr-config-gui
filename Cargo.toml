[package]
name = "herdr-config-gui"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"  # what slint 1.18 requires
license = "BSD-3-Clause"
publish = false

# `cargo bundle` reads this. Tauri used to produce the .app; the identifier and
# the product name are kept as they were so an existing install is replaced
# rather than doubled.
[package.metadata.bundle]
name = "herdr Config"
identifier = "dev.herdr.config-gui"
icon = [
    "icons/32x32.png",
    "icons/128x128.png",
    "icons/128x128@2x.png",
    "icons/icon.icns",
]
short_description = "A form for herdr's config.toml"

[dependencies]
# Slint under the royalty-free licence; the About dialog carries the
# attribution that licence asks for.
#
# The default feature set is off so that only what the app uses is built.
# Of the defaults, `system-tray` is gone (no tray icon here; on Linux it
# pulled in a D-Bus tray client) and `compat-1-2` gives way to the
# `compat-1-18` Slint requires.
#   std, compat-1-18     required by Slint itself
#   backend-winit        the windowing backend
#   renderer-femtovg     OpenGL rendering
#   renderer-software    the fallback where OpenGL will not start (VMs, RDP,
#                        missing drivers); without it the window never opens
#   accessibility        screen readers
#   unstable-winit-030   the raw winit events, which carry the physical key
#                        and the unswapped modifiers Slint discards; key
#                        recording needs both: see src/physical.rs
slint = { version = "1.18", default-features = false, features = [
    "std",
    "compat-1-18",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
    "accessibility",
    "unstable-winit-030",
] }
toml_edit = "0.25"
regex = "1"

[build-dependencies]
slint-build = "1.18"
