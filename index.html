<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>herdr Config</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header id="topbar">
      <h1>herdr Config</h1>
      <input id="filter" type="search" placeholder="設定を検索（キー名・説明文）" spellcheck="false" />
      <button id="only-dirty" disabled>未保存の変更 なし</button>
      <button id="problems">キー設定の問題 なし</button>
      <div id="meta">読み込み中…</div>
    </header>
    <main>
      <nav id="sections"></nav>
      <div
        id="resizer"
        tabindex="0"
        role="separator"
        aria-orientation="vertical"
        aria-label="サイドバーの幅"
        title="ドラッグで幅を変更 / ダブルクリックで自動フィット / ←→ キーで微調整"
      ></div>
      <section id="items"></section>
    </main>
    <footer id="savebar"></footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
