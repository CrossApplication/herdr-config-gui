[package]
name = "herdr-config-gui-slint-prototype"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
publish = false

# Deliberately not a workspace member of anything: this is a throwaway
# comparison build that must not disturb the shipping app.

[dependencies]
# Slint under the royalty-free licence; the About screen carries the
# attribution that licence asks for.
# `unstable-winit-030` exposes the raw winit events, which carry the physical
# key Slint itself discards. Needed to match the browser build's ev.code.
slint = { version = "1.18", features = ["unstable-winit-030"] }
serde = { version = "1", features = ["derive"] }
toml_edit = "0.22"
regex = "1"

[build-dependencies]
slint-build = "1.18"
